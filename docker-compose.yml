# Docker Compose for local development
# This stack is optimized for local/dev loops, not production hardening.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Core runtime
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - STORAGE_MODE=${STORAGE_MODE:-}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}

      # Model/provider configuration
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_DEPLOYMENT_NAME=${AZURE_OPENAI_DEPLOYMENT_NAME:-gpt-4o}
      - AZURE_OPENAI_API_VERSION=${AZURE_OPENAI_API_VERSION:-2025-04-01-preview}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}

      # External integrations and API auth
      - COSMOS_DB_ENDPOINT=${COSMOS_DB_ENDPOINT:-}
      - POSTGRES_DSN=${POSTGRES_DSN:-}
      - GITHUB_PERSONAL_ACCESS_TOKEN=${GITHUB_PERSONAL_ACCESS_TOKEN:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - API_AUTH_KEY=${API_AUTH_KEY:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}

      # Browser access controls
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - CORS_ALLOW_ORIGIN_REGEX=${CORS_ALLOW_ORIGIN_REGEX:-https://.*\\.azurecontainerapps\\.io}
      - VERIFY_WEBHOOK_SIGNATURE=${VERIFY_WEBHOOK_SIGNATURE:-true}
      - VERIFY_WEBHOOK_SIGNATURE_IN_DEVELOPMENT=${VERIFY_WEBHOOK_SIGNATURE_IN_DEVELOPMENT:-false}

      # Healing and retry policy
      - HEAL_MODE=${HEAL_MODE:-safe}
      - AUTO_APPLY_REMEDIATION=${AUTO_APPLY_REMEDIATION:-true}
      - MAX_REMEDIATION_ATTEMPTS=${MAX_REMEDIATION_ATTEMPTS:-3}
      - AUTO_CREATE_PR=${AUTO_CREATE_PR:-true}
      - AUTO_CREATE_ISSUE=${AUTO_CREATE_ISSUE:-true}
      - AUTO_RETRY_WORKFLOW=${AUTO_RETRY_WORKFLOW:-true}
      - AUTO_CREATE_TRACKING_ISSUE_FOR_PRS=${AUTO_CREATE_TRACKING_ISSUE_FOR_PRS:-true}
      - AUTO_MERGE_REMEDIATION_PRS=${AUTO_MERGE_REMEDIATION_PRS:-false}
      - AUTO_MERGE_STRATEGY=${AUTO_MERGE_STRATEGY:-merge_when_clean}
      - AUTO_MERGE_POLL_SECONDS=${AUTO_MERGE_POLL_SECONDS:-90}
      - AUTO_MERGE_REQUIRE_CLEAN_CHECKS=${AUTO_MERGE_REQUIRE_CLEAN_CHECKS:-true}
      - PIPELINE_STEP_TIMEOUT_SECONDS=${PIPELINE_STEP_TIMEOUT_SECONDS:-120}
      - GITHUB_API_MAX_RETRIES=${GITHUB_API_MAX_RETRIES:-3}
      - GITHUB_API_RETRY_BASE_SECONDS=${GITHUB_API_RETRY_BASE_SECONDS:-0.5}
      - GITHUB_API_RETRY_MAX_SECONDS=${GITHUB_API_RETRY_MAX_SECONDS:-8}
      - LOG_PROMPT_MAX_CHARS=${LOG_PROMPT_MAX_CHARS:-18000}
      - LOG_PROMPT_HEAD_CHARS=${LOG_PROMPT_HEAD_CHARS:-9000}
      - LOG_PROMPT_TAIL_CHARS=${LOG_PROMPT_TAIL_CHARS:-9000}

      # Optional external diagnostics (GitHub Agentic Workflows)
      - GH_AW_TOOLS_ENABLED=${GH_AW_TOOLS_ENABLED:-false}
      - GH_AW_INGESTION_MODE=${GH_AW_INGESTION_MODE:-disabled}
      - GH_AW_KNOWN_WORKFLOWS=${GH_AW_KNOWN_WORKFLOWS:-ci-doctor}
      - EXTERNAL_DIAGNOSTICS_WAIT_SECONDS=${EXTERNAL_DIAGNOSTICS_WAIT_SECONDS:-60}
      - EXTERNAL_DIAGNOSTICS_POLL_INTERVAL_SECONDS=${EXTERNAL_DIAGNOSTICS_POLL_INTERVAL_SECONDS:-15}

      # Jenkins bridge path
      - JENKINS_BRIDGE_ENABLED=${JENKINS_BRIDGE_ENABLED:-false}
      - JENKINS_BRIDGE_SHARED_SECRET=${JENKINS_BRIDGE_SHARED_SECRET:-}
      - JENKINS_BRIDGE_MAX_SKEW_SECONDS=${JENKINS_BRIDGE_MAX_SKEW_SECONDS:-300}
      - JENKINS_BRIDGE_REPLAY_TTL_SECONDS=${JENKINS_BRIDGE_REPLAY_TTL_SECONDS:-86400}
      - JENKINS_BRIDGE_MAX_BODY_BYTES=${JENKINS_BRIDGE_MAX_BODY_BYTES:-524288}
      - JENKINS_BRIDGE_ALLOW_PR=${JENKINS_BRIDGE_ALLOW_PR:-false}

      # Assign-to-Agent runtime path. Keep the webhook URL deployment-managed.
      - AGENT_HANDOFF_ENABLED=${AGENT_HANDOFF_ENABLED:-false}
      - AGENT_HANDOFF_MODE=${AGENT_HANDOFF_MODE:-copy_only}
      - AGENT_HANDOFF_WEBHOOK_URL=${AGENT_HANDOFF_WEBHOOK_URL:-}
      - AGENT_HANDOFF_WEBHOOK_ALLOWLIST=${AGENT_HANDOFF_WEBHOOK_ALLOWLIST:-}
      - AGENT_HANDOFF_TIMEOUT_SECONDS=${AGENT_HANDOFF_TIMEOUT_SECONDS:-8}
      - AGENT_HANDOFF_MAX_RETRIES=${AGENT_HANDOFF_MAX_RETRIES:-1}
    volumes:
      # Mount source read-only so local code changes are visible in containerized dev runs.
      - ./backend/src:/app/src:ro
    networks:
      - pipelinehealer

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Runtime reverse-proxy target used by Nginx in the frontend container.
      - BACKEND_UPSTREAM=${FRONTEND_BACKEND_UPSTREAM:-http://backend:8000}
      - API_AUTH_KEY=${API_AUTH_KEY:-}
      # Runtime frontend config (overrides build defaults without image rebuild).
      - VITE_AUTH_MODE=${VITE_AUTH_MODE:-none}
      - VITE_ENTRA_TENANT_ID=${VITE_ENTRA_TENANT_ID:-}
      - VITE_ENTRA_CLIENT_ID=${VITE_ENTRA_CLIENT_ID:-}
      - VITE_ENTRA_AUTHORITY=${VITE_ENTRA_AUTHORITY:-}
      - VITE_ENTRA_API_SCOPE=${VITE_ENTRA_API_SCOPE:-}
      - VITE_ENTRA_REDIRECT_URI=${VITE_ENTRA_REDIRECT_URI:-}
      - VITE_ENTRA_POST_LOGOUT_REDIRECT_URI=${VITE_ENTRA_POST_LOGOUT_REDIRECT_URI:-}
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_API_AUTH_KEY=${VITE_API_AUTH_KEY:-}
      - VITE_API_TIMEOUT_MS=${VITE_API_TIMEOUT_MS:-15000}
    depends_on:
      - backend
    networks:
      - pipelinehealer

  # Azure Cosmos DB Emulator (for local development)
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    profiles: ["cosmos"]
    ports:
      - "8081:8081"
      - "10251:10251"
      - "10252:10252"
      - "10253:10253"
      - "10254:10254"
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=10
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=true
    volumes:
      - cosmos-data:/data
    networks:
      - pipelinehealer

  # Optional PostgreSQL for local durable storage testing.
  # Start with: docker compose --profile postgres up -d postgres
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pipelinehealer}
      - POSTGRES_USER=${POSTGRES_USER:-pipelinehealer}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pipelinehealer}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipelinehealer} -d ${POSTGRES_DB:-pipelinehealer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipelinehealer

networks:
  pipelinehealer:
    driver: bridge

volumes:
  cosmos-data:
  postgres-data:
