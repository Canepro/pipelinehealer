[project]
name = "pipelinehealer"
version = "0.8.6"
description = "Self-healing CI/CD agent system using Microsoft Agent Framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PipelineHealer Team" }
]
keywords = ["ai", "agents", "devops", "cicd", "github-actions", "azure"]

dependencies = [
    # Published Agent Framework builds are currently pre-releases; pinning an
    # explicit rc floor keeps editable installs resolvable in pip/uv.
    "agent-framework-core>=1.0.0rc3",
    # uv requires explicit opt-in for this transitive pre-release dependency.
    "azure-ai-projects==2.0.0b4",
    "aiohttp>=3.10.0",
    "azure-identity>=1.19.0",
    "azure-cosmos>=4.9.0",
    "azure-keyvault-secrets>=4.9.0",
    "azure-monitor-opentelemetry>=1.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "cryptography>=43.0.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "pyjwt[crypto]>=2.10.1",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The backend currently uses `backend/src` as the import package root (imports like `from src...`).
# Hatchling can't infer this automatically from the project name `pipelinehealer`, so we declare it.
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.lint.per-file-ignores]
# FastAPI commonly uses `Query(...)`/`Path(...)` in signature defaults.
"src/api/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
