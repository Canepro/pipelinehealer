name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  packages: write

env:
  ACR_NAME: ${{ vars.ACR_NAME || 'caneprophacr01' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: Publish GitHub Release + Container Images
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate version sync
        run: bash scripts/check_version_sync.sh

      - name: Validate tag matches VERSION
        id: meta
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(cat VERSION | tr -d '\r\n')"
          expected="v${version}"
          if [[ "$TAG_NAME" != "$expected" ]]; then
            echo "Tag/version mismatch." >&2
            echo "  tag:      $TAG_NAME" >&2
            echo "  expected: $expected" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "release_tag=$TAG_NAME" >>"$GITHUB_OUTPUT"

      - name: Resolve Azure ACR publish mode
        id: azure_mode
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=0
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::notice::Optional Azure secret missing: ${key}"
              missing=1
            fi
          done
          if [[ "$missing" -eq 0 ]]; then
            echo "enabled=true" >>"$GITHUB_OUTPUT"
            echo "ACR publish enabled."
          else
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            echo "ACR publish disabled; GHCR public publish remains enabled."
          fi

      - name: Resolve GHCR namespace
        id: ghcr
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          owner_lc="$(echo "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$owner_lc" ]]; then
            echo "Unable to resolve GitHub repository owner." >&2
            exit 1
          fi
          echo "owner_lc=$owner_lc" >>"$GITHUB_OUTPUT"
          echo "base=ghcr.io/${owner_lc}" >>"$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Azure login (OIDC)
        if: steps.azure_mode.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        id: acr
        if: steps.azure_mode.outputs.enabled == 'true'
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          login_server=""
          selected_subscription=""

          # Prefer the configured subscription first.
          if [[ -n "${AZURE_SUBSCRIPTION_ID:-}" ]]; then
            az account set --subscription "$AZURE_SUBSCRIPTION_ID" >/dev/null 2>&1 || true
            login_server="$(az acr show -n "$ACR_NAME" --query loginServer -o tsv 2>/dev/null | tr -d '\r\n' || true)"
            if [[ -n "$login_server" ]]; then
              selected_subscription="$AZURE_SUBSCRIPTION_ID"
            fi
          fi

          # Fallback: find the subscription that contains this ACR.
          if [[ -z "$login_server" ]]; then
            while IFS= read -r sid; do
              [[ -z "$sid" ]] && continue
              az account set --subscription "$sid" >/dev/null 2>&1 || continue
              candidate="$(az acr show -n "$ACR_NAME" --query loginServer -o tsv 2>/dev/null | tr -d '\r\n' || true)"
              if [[ -n "$candidate" ]]; then
                login_server="$candidate"
                selected_subscription="$sid"
                break
              fi
            done < <(az account list --query "[].id" -o tsv | tr -d '\r')
          fi

          if [[ -z "$login_server" ]]; then
            echo "Unable to find ACR '$ACR_NAME' in subscriptions available to this identity." >&2
            az account list --query "[].{name:name,id:id}" -o table || true
            exit 1
          fi

          echo "Using subscription: $selected_subscription"
          token="$(az acr login -n "$ACR_NAME" --expose-token --query accessToken -o tsv | tr -d '\r\n')"
          echo "$token" | docker login "$login_server" --username 00000000-0000-0000-0000-000000000000 --password-stdin
          echo "login_server=$login_server" >>"$GITHUB_OUTPUT"

      - name: Prepare image tags
        id: image_tags
        env:
          GHCR_BASE: ${{ steps.ghcr.outputs.base }}
          ACR_ENABLED: ${{ steps.azure_mode.outputs.enabled }}
          ACR_LOGIN_SERVER: ${{ steps.acr.outputs.login_server }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          backend_tags="$(printf '%s\n%s' \
            "${GHCR_BASE}/pipelinehealer-backend:${RELEASE_TAG}" \
            "${GHCR_BASE}/pipelinehealer-backend:${VERSION}")"
          frontend_tags="$(printf '%s\n%s' \
            "${GHCR_BASE}/pipelinehealer-frontend:${RELEASE_TAG}" \
            "${GHCR_BASE}/pipelinehealer-frontend:${VERSION}")"

          if [[ "${ACR_ENABLED}" == "true" && -n "${ACR_LOGIN_SERVER}" ]]; then
            backend_tags="$(printf '%s\n%s\n%s' \
              "${backend_tags}" \
              "${ACR_LOGIN_SERVER}/pipelinehealer-backend:${RELEASE_TAG}" \
              "${ACR_LOGIN_SERVER}/pipelinehealer-backend:${VERSION}")"
            frontend_tags="$(printf '%s\n%s\n%s' \
              "${frontend_tags}" \
              "${ACR_LOGIN_SERVER}/pipelinehealer-frontend:${RELEASE_TAG}" \
              "${ACR_LOGIN_SERVER}/pipelinehealer-frontend:${VERSION}")"
          fi

          {
            echo "backend<<EOF"
            printf '%s\n' "${backend_tags}"
            echo "EOF"
            echo "frontend<<EOF"
            printf '%s\n' "${frontend_tags}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        id: backend_image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.image_tags.outputs.backend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        id: frontend_image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.image_tags.outputs.frontend }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR for Helm OCI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Publish Helm chart to GHCR OCI
        id: helm_chart
        env:
          OWNER_LC: ${{ steps.ghcr.outputs.owner_lc }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          chart_archive="$(helm package charts/pipelinehealer --destination . | awk '{print $NF}')"
          helm push "${chart_archive}" "oci://ghcr.io/${OWNER_LC}/charts"
          echo "ref=oci://ghcr.io/${OWNER_LC}/charts/pipelinehealer:${VERSION}" >>"$GITHUB_OUTPUT"

      - name: Verify GHCR anonymous pullability
        env:
          OWNER_LC: ${{ steps.ghcr.outputs.owner_lc }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          BACKEND_DIGEST: ${{ steps.backend_image.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend_image.outputs.digest }}
        run: |
          set -euo pipefail
          bash scripts/release/check_ghcr_pullability.sh \
            --owner-lc "${OWNER_LC}" \
            --release-tag "${RELEASE_TAG}" \
            --version "${VERSION}" \
            --backend-digest "${BACKEND_DIGEST}" \
            --frontend-digest "${FRONTEND_DIGEST}"

      - name: Generate release image references
        env:
          GHCR_BASE: ${{ steps.ghcr.outputs.base }}
          ACR_ENABLED: ${{ steps.azure_mode.outputs.enabled }}
          ACR_LOGIN_SERVER: ${{ steps.acr.outputs.login_server }}
          RELEASE_TAG: ${{ steps.meta.outputs.release_tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          BACKEND_DIGEST: ${{ steps.backend_image.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend_image.outputs.digest }}
          HELM_CHART_REF: ${{ steps.helm_chart.outputs.ref }}
        run: |
          {
            echo "### GHCR (Public)"
            echo "- Backend tag (\`${RELEASE_TAG}\`): \`${GHCR_BASE}/pipelinehealer-backend:${RELEASE_TAG}\`"
            echo "- Backend tag (\`${VERSION}\`): \`${GHCR_BASE}/pipelinehealer-backend:${VERSION}\`"
            echo "- Backend digest: \`${GHCR_BASE}/pipelinehealer-backend@${BACKEND_DIGEST}\`"
            echo "- Frontend tag (\`${RELEASE_TAG}\`): \`${GHCR_BASE}/pipelinehealer-frontend:${RELEASE_TAG}\`"
            echo "- Frontend tag (\`${VERSION}\`): \`${GHCR_BASE}/pipelinehealer-frontend:${VERSION}\`"
            echo "- Frontend digest: \`${GHCR_BASE}/pipelinehealer-frontend@${FRONTEND_DIGEST}\`"
            echo
            echo "### Helm OCI (GHCR)"
            echo "- Chart: \`${HELM_CHART_REF}\`"
            if [[ "${ACR_ENABLED}" == "true" && -n "${ACR_LOGIN_SERVER}" ]]; then
              echo
              echo "### ACR (Optional Azure Mirror)"
              echo "- Backend tag (\`${RELEASE_TAG}\`): \`${ACR_LOGIN_SERVER}/pipelinehealer-backend:${RELEASE_TAG}\`"
              echo "- Backend tag (\`${VERSION}\`): \`${ACR_LOGIN_SERVER}/pipelinehealer-backend:${VERSION}\`"
              echo "- Backend digest: \`${ACR_LOGIN_SERVER}/pipelinehealer-backend@${BACKEND_DIGEST}\`"
              echo "- Frontend tag (\`${RELEASE_TAG}\`): \`${ACR_LOGIN_SERVER}/pipelinehealer-frontend:${RELEASE_TAG}\`"
              echo "- Frontend tag (\`${VERSION}\`): \`${ACR_LOGIN_SERVER}/pipelinehealer-frontend:${VERSION}\`"
              echo "- Frontend digest: \`${ACR_LOGIN_SERVER}/pipelinehealer-frontend@${FRONTEND_DIGEST}\`"
            fi
          } > release_images.md

      - name: Extract release notes from CHANGELOG
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["TAG_NAME"].strip()
          raw = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(tag)}\](?: - [^\n]+)?\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, raw, flags=re.MULTILINE | re.DOTALL)
          if not match:
              raise SystemExit(f"Missing CHANGELOG section for {tag}.")
          notes = match.group(1).strip()
          if not notes:
              raise SystemExit(f"Empty CHANGELOG section for {tag}.")
          Path("release_notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Append container image references to release notes
        run: |
          {
            echo
            echo "## Container Images"
            echo
            cat release_images.md
          } >> release_notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          generate_release_notes: false
          files: release_images.md
