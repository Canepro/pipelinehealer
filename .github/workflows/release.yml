name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

env:
  ACR_NAME: ${{ vars.ACR_NAME || 'caneprophacr01' }}

jobs:
  publish:
    name: Publish GitHub Release + ACR Images
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version sync
        run: bash scripts/check_version_sync.sh

      - name: Validate tag matches VERSION
        id: meta
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(cat VERSION | tr -d '\r\n')"
          expected="v${version}"
          if [[ "$TAG_NAME" != "$expected" ]]; then
            echo "Tag/version mismatch." >&2
            echo "  tag:      $TAG_NAME" >&2
            echo "  expected: $expected" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "release_tag=$TAG_NAME" >>"$GITHUB_OUTPUT"

      - name: Validate Azure OIDC secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          missing=0
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required repository secret: ${key}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Validate frontend auth build variables
        env:
          VITE_AUTH_MODE: ${{ vars.VITE_AUTH_MODE || 'none' }}
          VITE_ENTRA_TENANT_ID: ${{ vars.VITE_ENTRA_TENANT_ID || '' }}
          VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID || '' }}
          VITE_ENTRA_AUTHORITY: ${{ vars.VITE_ENTRA_AUTHORITY || '' }}
          VITE_ENTRA_API_SCOPE: ${{ vars.VITE_ENTRA_API_SCOPE || '' }}
        run: |
          set -euo pipefail
          mode="$(echo "${VITE_AUTH_MODE:-none}" | tr '[:upper:]' '[:lower:]' | tr -d '\r\n' | xargs)"
          if [[ "$mode" != "none" && "$mode" != "entra" ]]; then
            echo "::error::Invalid VITE_AUTH_MODE='$VITE_AUTH_MODE'. Allowed values: none, entra."
            exit 1
          fi

          if [[ "$mode" == "entra" ]]; then
            missing=0
            if [[ -z "${VITE_ENTRA_CLIENT_ID:-}" ]]; then
              echo "::error::VITE_AUTH_MODE=entra requires VITE_ENTRA_CLIENT_ID."
              missing=1
            fi
            if [[ -z "${VITE_ENTRA_API_SCOPE:-}" ]]; then
              echo "::error::VITE_AUTH_MODE=entra requires VITE_ENTRA_API_SCOPE."
              missing=1
            fi
            if [[ -z "${VITE_ENTRA_AUTHORITY:-}" && -z "${VITE_ENTRA_TENANT_ID:-}" ]]; then
              echo "::error::VITE_AUTH_MODE=entra requires VITE_ENTRA_AUTHORITY or VITE_ENTRA_TENANT_ID."
              missing=1
            fi
            if [[ "$missing" -ne 0 ]]; then
              exit 1
            fi
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        id: acr
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          login_server=""
          selected_subscription=""

          # Prefer the configured subscription first.
          if [[ -n "${AZURE_SUBSCRIPTION_ID:-}" ]]; then
            az account set --subscription "$AZURE_SUBSCRIPTION_ID" >/dev/null 2>&1 || true
            login_server="$(az acr show -n "$ACR_NAME" --query loginServer -o tsv 2>/dev/null | tr -d '\r\n' || true)"
            if [[ -n "$login_server" ]]; then
              selected_subscription="$AZURE_SUBSCRIPTION_ID"
            fi
          fi

          # Fallback: find the subscription that contains this ACR.
          if [[ -z "$login_server" ]]; then
            while IFS= read -r sid; do
              [[ -z "$sid" ]] && continue
              az account set --subscription "$sid" >/dev/null 2>&1 || continue
              candidate="$(az acr show -n "$ACR_NAME" --query loginServer -o tsv 2>/dev/null | tr -d '\r\n' || true)"
              if [[ -n "$candidate" ]]; then
                login_server="$candidate"
                selected_subscription="$sid"
                break
              fi
            done < <(az account list --query "[].id" -o tsv | tr -d '\r')
          fi

          if [[ -z "$login_server" ]]; then
            echo "Unable to find ACR '$ACR_NAME' in subscriptions available to this identity." >&2
            az account list --query "[].{name:name,id:id}" -o table || true
            exit 1
          fi

          echo "Using subscription: $selected_subscription"
          token="$(az acr login -n "$ACR_NAME" --expose-token --query accessToken -o tsv | tr -d '\r\n')"
          echo "$token" | docker login "$login_server" --username 00000000-0000-0000-0000-000000000000 --password-stdin
          echo "login_server=$login_server" >>"$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        id: backend_image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ steps.acr.outputs.login_server }}/pipelinehealer-backend:${{ steps.meta.outputs.release_tag }}
            ${{ steps.acr.outputs.login_server }}/pipelinehealer-backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        id: frontend_image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_AUTH_MODE=${{ vars.VITE_AUTH_MODE || 'none' }}
            VITE_ENTRA_TENANT_ID=${{ vars.VITE_ENTRA_TENANT_ID || '' }}
            VITE_ENTRA_CLIENT_ID=${{ vars.VITE_ENTRA_CLIENT_ID || '' }}
            VITE_ENTRA_AUTHORITY=${{ vars.VITE_ENTRA_AUTHORITY || '' }}
            VITE_ENTRA_API_SCOPE=${{ vars.VITE_ENTRA_API_SCOPE || '' }}
            VITE_ENTRA_REDIRECT_URI=${{ vars.VITE_ENTRA_REDIRECT_URI || '' }}
            VITE_ENTRA_POST_LOGOUT_REDIRECT_URI=${{ vars.VITE_ENTRA_POST_LOGOUT_REDIRECT_URI || '' }}
            VITE_API_URL=${{ vars.VITE_API_URL || '' }}
            VITE_API_TIMEOUT_MS=${{ vars.VITE_API_TIMEOUT_MS || '15000' }}
          tags: |
            ${{ steps.acr.outputs.login_server }}/pipelinehealer-frontend:${{ steps.meta.outputs.release_tag }}
            ${{ steps.acr.outputs.login_server }}/pipelinehealer-frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate release image references
        run: |
          {
            echo "- Backend tag (\`${{ steps.meta.outputs.release_tag }}\`): \`${{ steps.acr.outputs.login_server }}/pipelinehealer-backend:${{ steps.meta.outputs.release_tag }}\`"
            echo "- Backend tag (\`${{ steps.meta.outputs.version }}\`): \`${{ steps.acr.outputs.login_server }}/pipelinehealer-backend:${{ steps.meta.outputs.version }}\`"
            echo "- Backend digest: \`${{ steps.acr.outputs.login_server }}/pipelinehealer-backend@${{ steps.backend_image.outputs.digest }}\`"
            echo "- Frontend tag (\`${{ steps.meta.outputs.release_tag }}\`): \`${{ steps.acr.outputs.login_server }}/pipelinehealer-frontend:${{ steps.meta.outputs.release_tag }}\`"
            echo "- Frontend tag (\`${{ steps.meta.outputs.version }}\`): \`${{ steps.acr.outputs.login_server }}/pipelinehealer-frontend:${{ steps.meta.outputs.version }}\`"
            echo "- Frontend digest: \`${{ steps.acr.outputs.login_server }}/pipelinehealer-frontend@${{ steps.frontend_image.outputs.digest }}\`"
          } > release_images.md

      - name: Extract release notes from CHANGELOG
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["TAG_NAME"].strip()
          raw = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^## \[{re.escape(tag)}\](?: - [^\n]+)?\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, raw, flags=re.MULTILINE | re.DOTALL)
          if not match:
              raise SystemExit(f"Missing CHANGELOG section for {tag}.")
          notes = match.group(1).strip()
          if not notes:
              raise SystemExit(f"Empty CHANGELOG section for {tag}.")
          Path("release_notes.md").write_text(notes + "\n", encoding="utf-8")
          PY

      - name: Append container image references to release notes
        run: |
          {
            echo
            echo "## Container Images"
            echo
            cat release_images.md
          } >> release_notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          generate_release_notes: false
          files: release_images.md
