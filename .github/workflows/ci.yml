name: CI

on:
  pull_request:
  push:
    # Tag pushes are handled by release.yml.
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Keep shell scripts linted because scripts/ph.sh is an operator-critical entrypoint.
  shellcheck:
    name: ShellCheck Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run ShellCheck
        run: shellcheck scripts/ph.sh scripts/release.sh scripts/check_version_sync.sh scripts/deploy/*.sh scripts/demo/*.sh

  # Enforces version alignment across VERSION/backend/frontend package metadata.
  version_sync:
    name: Version Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify root/backend/frontend versions are aligned
        run: bash scripts/check_version_sync.sh

  # Backend gate: tests + static typing.
  backend:
    name: Backend Tests and Types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install backend dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Run mypy
        run: mypy src

  # Frontend gate: lint + production build.
  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run build
        run: bun run build
