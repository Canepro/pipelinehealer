# Azure Developer CLI (azd) configuration
name: pipelinehealer
metadata:
  template: pipelinehealer@0.1.0

services:
  backend:
    project: ./backend
    language: python
    host: containerapp

  frontend:
    project: ./frontend
    language: ts
    host: containerapp

infra:
  provider: bicep
  path: ./infra

hooks:
  preprovision:
    shell: sh
    run: |
      echo "Preparing to provision Azure resources..."
  
  postprovision:
    shell: sh
    run: |
      echo "Azure resources provisioned successfully!"
      echo "Backend URL: ${AZURE_BACKEND_URL}"
      echo "Frontend URL: ${AZURE_FRONTEND_URL}"
