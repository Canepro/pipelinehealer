apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pipelinehealer.backend.fullname" . }}-secrets
  labels:
    {{- include "pipelinehealer.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
# stringData allows plain text input; Kubernetes stores it base64-encoded in data.
stringData:
{{- range $key, $value := .Values.backend.secretEnv }}
  {{ $key }}: {{ $value | toString | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pipelinehealer.frontend.fullname" . }}-secrets
  labels:
    {{- include "pipelinehealer.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
type: Opaque
stringData:
{{- range $key, $value := .Values.frontend.secretEnv }}
  {{ $key }}: {{ $value | toString | quote }}
{{- end }}
